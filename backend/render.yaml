services:
  - type: web
    name: tawi-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && flask db upgrade && python seed.py"
    startCommand: "gunicorn run:app"
    envVars:
      - key: FLASK_APP
        value: run.py
      # Paste your Neon (or other Postgres) connection string here during
      # setup -- using Neon instead of Render's own Postgres because
      # Render's free database expires after 30 days and Neon's doesn't.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: TURNSTILE_SITE_KEY
        value: 1x00000000000000000000AA
      - key: TURNSTILE_SECRET_KEY
        value: 1x0000000000000000000000000000000AA
